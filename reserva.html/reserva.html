
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reserva de Café ☕</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #241108, #7b4525);
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
        }

        .cafe {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            color: #3b1c0d;
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #777;
            margin-bottom: 25px;
        }

        .campo {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #3b1c0d;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 17px;
            outline: none;
        }

        input:focus {
            border-color: #7b4525;
            box-shadow: 0 0 0 3px rgba(123, 69, 37, .12);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: #7b4525;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: #4d2816;
            transform: translateY(-2px);
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            display: none;
            line-height: 1.6;
        }

        .exito {
            display: block !important;
            background: #dff7e5;
            color: #176b2c;
        }

        .error {
            display: block !important;
            background: #ffe0e0;
            color: #a02020;
        }

        .regla {
            margin-top: 20px;
            padding: 12px;
            background: #f5eee9;
            border-radius: 10px;
            color: #68402b;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="cafe">☕</div>

        <h1>Reserva tu café</h1>

        <p class="subtitulo">
            Reserva tus cafés antes de venir
        </p>

        <!-- Cantidad de personas -->
        <div class="campo">
            <label for="personas">
                👥 Cantidad de personas
            </label>

            <input
                type="number"
                id="personas"
                min="1"
                placeholder="Ej: 2"
            >
        </div>

        <!-- Cantidad de tazas -->
        <div class="campo">
            <label for="tazas">
                ☕ Cantidad de tazas
            </label>

            <input
                type="number"
                id="tazas"
                min="1"
                max="2"
                placeholder="Máximo 2"
            >
        </div>

        <button onclick="verificarReserva()">
            Reservar café ☕
        </button>

        <div id="resultado"></div>

        <div class="regla">
            💡 Se pueden reservar como máximo
            <strong>2 tazas de café</strong>.
        </div>

    </div>


    <script>

        function verificarReserva() {

            // Obtener los datos
            const personas = Number(
                document.getElementById("personas").value
            );

            const tazas = Number(
                document.getElementById("tazas").value
            );

            const resultado =
                document.getElementById("resultado");


            // Validar los datos
            if (personas <= 0 || tazas <= 0) {

                resultado.className = "error";

                resultado.innerHTML =
                    "⚠️ Ingresa una cantidad válida de personas y tazas.";

                return;
            }


            // Regla: máximo 2 tazas
            if (tazas <= 2) {

                resultado.className = "exito";

                resultado.innerHTML = `
                    ✅ <strong>¡Reserva permitida!</strong><br>
                    👥 Personas: ${personas}<br>
                    ☕ Tazas reservadas: ${tazas}
                `;

            } else {

                resultado.className = "error";

                resultado.innerHTML = `
                    ❌ <strong>Reserva rechazada</strong><br>
                    👥 Personas: ${personas}<br>
                    ☕ Solamente puedes reservar
                    un máximo de 2 tazas.
                `;
            }
        }

    </script>

</body>
</html>
